<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VCT Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,600;0,800;1,800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#08090D; --bg2:#0D0F15; --panel:#13151C; --panel2:#191C25; --panel3:#20242F; --line:#252A36; --line2:#313747;
  --ink:#ECEEF3; --muted:#8B92A3; --dim:#5E6475;
  --red:#E5162B; --red2:#FF4D5E; --redbg:rgba(229,22,43,.12);
  --atk:#FF6B5B; --def:#3FD1B8; --win:#4ADE80; --loss:#F87171; --warn:#F5B942;
  --ta:#FF4D5E; --tb:#3FD1B8;
  --r-D:#FF6B5B; --r-I:#F5B942; --r-C:#8B7CFF; --r-S:#3FD1B8; --r-F:#9AA3B5;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14.5px/1.45 "Barlow",system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer} button:disabled{cursor:not-allowed;opacity:.45}
h1,h2,h3,h4{font-family:"Saira Condensed",sans-serif;font-weight:800;margin:0 0 6px;line-height:1.1;letter-spacing:.01em;text-wrap:balance}
h2{font-size:25px} h3{font-size:18px;text-transform:uppercase;letter-spacing:.04em} h4{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0 0 10px} code{font-family:"JetBrains Mono",monospace;font-size:12px;background:var(--panel3);padding:1px 5px;border-radius:4px}
.muted{color:var(--muted)} .center{text-align:center;justify-content:center}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px}
.num.big{font-size:14px;font-weight:700}
.pos{color:var(--win)} .neg{color:var(--loss)}
.k{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}

/* ---------- casca do jogo ---------- */
.game{display:grid;grid-template-columns:228px minmax(0,1fr);height:100vh;height:100dvh}
.side{background:linear-gradient(180deg,#0E1016,#08090C);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;font-family:"Saira Condensed",sans-serif;font-weight:800;font-style:italic;font-size:21px;letter-spacing:.06em;padding:18px 18px 10px}
.brand b{width:8px;height:24px;background:var(--red);transform:skewX(-14deg);display:block;box-shadow:0 0 18px rgba(229,22,43,.6)}
.brand em{color:var(--red2);font-style:italic;margin-left:4px}
.brand.big{font-size:30px;padding:0} .brand.big b{height:34px;width:11px}
.club{display:flex;align-items:center;gap:10px;margin:6px 12px 10px;padding:10px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.club strong{display:block;font-size:14px;line-height:1.15} .club small{color:var(--muted);font-size:12px}
.navs{display:flex;flex-direction:column;padding:4px 8px;gap:1px}
.navi{display:flex;align-items:center;gap:11px;padding:9px 12px;border:0;background:none;border-radius:8px;color:var(--muted);font-weight:600;text-align:left;position:relative}
.navi:hover{background:var(--panel);color:var(--ink)}
.navi span{white-space:nowrap}
.navi.on{background:linear-gradient(90deg,var(--redbg),transparent);color:var(--ink)}
.navi.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--red)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{margin-left:auto;font-style:normal;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:0 7px;line-height:18px}
.navsep{height:1px;background:var(--line);margin:6px 10px}
.sidefoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-family:"JetBrains Mono",monospace;font-weight:700}
.sidefoot small{display:block;font-family:"Barlow",sans-serif;color:var(--muted);font-weight:500;font-size:12px}
.mainc{display:flex;flex-direction:column;min-width:0;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#11131A,#0B0C11);flex-wrap:wrap}
.topbar .tt{flex:1;min-width:180px}
.topbar h1{font-size:28px;font-style:italic;margin:0;text-transform:uppercase}
.fase{color:var(--muted);font-size:12.5px}
.date{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-weight:600;font-size:13.5px}
.contw{display:flex;align-items:stretch;gap:6px}
.btn.cont{background:linear-gradient(180deg,#FF2B40,#C50F22);border:0;color:#fff;font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:19px;letter-spacing:.06em;padding:6px 22px;border-radius:8px;line-height:1.05;display:flex;flex-direction:column;align-items:center;box-shadow:0 6px 22px rgba(229,22,43,.35)}
.btn.cont small{font-family:"Barlow",sans-serif;font-size:11px;font-weight:600;letter-spacing:.04em;opacity:.85;text-transform:none}
.btn.cont:hover{filter:brightness(1.1)}
.btn.ff{background:#9E0D1C;border:0;color:#fff;font-size:22px;font-weight:800;padding:0 13px;border-radius:8px}
.stage{flex:1;overflow-y:auto;padding:20px 22px 30px}
.warn{background:rgba(245,185,66,.12);color:var(--warn);padding:8px 20px;font-size:13px}
.foot{color:var(--dim);font-size:11.5px;margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}

/* ---------- básicos ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card.inner{background:var(--panel2)}
.card.hot{border-color:rgba(229,22,43,.5);background:linear-gradient(135deg,rgba(229,22,43,.14),var(--panel) 60%)}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.grid2.wide{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{display:flex;flex-direction:column;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.row.end{justify-content:flex-end}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover:not(:disabled){background:#FF2B40}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(248,113,113,.5);color:var(--loss)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{padding:12px 22px;font-size:16px}
.btn.atk{border-color:var(--atk);color:var(--atk)} .btn.def{border-color:var(--def);color:var(--def)}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:600;font-size:13.5px}
.seg button.on{background:var(--panel3);color:var(--ink);box-shadow:inset 0 -2px 0 var(--red)}
.seg.sm{margin:0} .seg.sm button{padding:4px 9px;font-size:12.5px}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--panel3);color:var(--muted);font-weight:600}
.chip.ok{background:rgba(74,222,128,.13);color:var(--win)} .chip.bad{background:rgba(248,113,113,.13);color:var(--loss)}
.chip.warn{background:rgba(245,185,66,.13);color:var(--warn)} .chip.live{background:var(--red);color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.6}}
.banner{padding:10px 14px;border-radius:9px;background:var(--panel2);border:1px solid var(--line2);margin-bottom:12px;font-size:13.5px}
.banner.ok{border-color:rgba(74,222,128,.35)} .banner.bad{border-color:rgba(248,113,113,.4);color:var(--loss)}
.role{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.r-D{color:var(--r-D)} .r-I{color:var(--r-I)} .r-C{color:var(--r-C)} .r-S{color:var(--r-S)} .r-F{color:var(--r-F)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.you td{background:var(--redbg)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.acts{white-space:nowrap;text-align:right} .acts .btn{margin-left:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 12px} .kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select,.offer-in,textarea,.ag select{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:7px 10px}
.filters input{flex:1;min-width:180px}
.offer-in{width:130px}
textarea{width:100%;font-family:"JetBrains Mono",monospace;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:11px 18px;border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:50;max-width:calc(100% - 32px)}
.toast.ok{border-color:rgba(74,222,128,.45)} .toast.bad{border-color:rgba(248,113,113,.5)}
.bar{display:inline-block;height:6px;border-radius:4px;background:var(--line2);overflow:hidden;width:100%;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--muted);border-radius:4px}
.bar.hp i{background:var(--win)} .bar.hp.low i{background:var(--loss)} .bar.mo i{background:var(--warn)} .bar.fo i{background:var(--def)}

/* ---------- arte ---------- */
.face{position:relative;display:inline-block;width:40px;height:40px;flex:none;border-radius:10px;overflow:hidden;background:var(--panel3)}
.face .av{width:100%;height:100%;display:block}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.face.xs{width:26px;height:26px;border-radius:7px} .face.sm{width:34px;height:34px;border-radius:8px}
.face.md{width:52px;height:52px;border-radius:12px} .face.lg{width:66px;height:66px;border-radius:14px}
.face.xl{width:92px;height:92px;border-radius:16px} .face.xxl{width:132px;height:132px;border-radius:20px}
.face.empty{display:grid;place-items:center;color:var(--muted);font-weight:800;border:1px dashed var(--line2);background:none}
.cw{display:inline-block;width:32px;height:32px;flex:none;vertical-align:middle}
.cw.xs{width:20px;height:20px} .cw.sm{width:28px;height:28px} .cw.md{width:40px;height:40px} .cw.lg{width:56px;height:56px} .cw.xl{width:84px;height:84px}
.crestw{position:relative;display:block;width:100%;height:100%}
.crestw svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.crestw img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tchip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap} .tchip b{font-weight:700;font-size:13.5px}
.tchip.you b{color:var(--red2)}
.st5{display:inline-flex;gap:2px;vertical-align:middle}
.st5 i{width:12px;height:12px;background:var(--line2);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.st5 i.on{background:var(--warn)} .st5 i.half{background:linear-gradient(90deg,var(--warn) 50%,var(--line2) 50%)}
.ring{display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.ring svg{width:64px;height:64px} .ring text{fill:var(--ink);font:700 17px "JetBrains Mono",monospace}
.rings{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-around;margin-top:10px}
.radar{width:100%;max-width:340px;display:block;margin:0 auto} .radar text{fill:var(--muted);font:600 11px Barlow,sans-serif}
.radar-unk{padding:40px 10px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:10px}

/* ---------- escolha de time ---------- */
.pick{max-width:1180px;margin:0 auto;padding:26px 16px 30px}
.pickhead{margin-bottom:16px} .pickhead h1{font-size:clamp(34px,5vw,52px);font-style:italic;text-transform:uppercase;margin-top:14px}
.savebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid rgba(229,22,43,.4);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.savebar div{flex:1;min-width:160px} .savebar strong{display:block} .savebar small{color:var(--muted)}
.ligtabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.ligtabs button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:600;color:var(--muted)}
.ligtabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.pickgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.tlist{display:flex;flex-direction:column;gap:4px;max-height:640px;overflow-y:auto;padding-right:4px}
.trow{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;text-align:left}
.trow:hover{border-color:var(--line2)} .trow.on{border-color:var(--red);background:linear-gradient(90deg,var(--redbg),var(--panel))}
.tn{flex:1;min-width:0} .tn strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .tn small{color:var(--muted)}
.dif{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.d5{background:rgba(74,222,128,.14);color:var(--win)} .d4{background:rgba(63,209,184,.14);color:var(--def)} .d3{background:rgba(245,185,66,.14);color:var(--warn)} .d2{background:rgba(255,107,91,.14);color:var(--atk)} .d1{background:rgba(248,113,113,.2);color:var(--loss)}
.tdetail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;position:sticky;top:10px}
.thead{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.sec{margin:14px 0 8px}
.pmini{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pm{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--panel2);border-radius:10px;padding:10px 6px}
.pm strong{font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis} .pm small{color:var(--muted);font-size:11px}
.coach{display:flex;align-items:center;gap:12px;margin-bottom:16px} .coach strong{display:block} .coach small{color:var(--muted)}
.tdetail .btn.big{width:100%}
.fine{color:var(--dim);font-size:12px;margin-top:14px}

/* ---------- início ---------- */
.nextm h2{font-size:24px}
.vsbig{display:flex;align-items:center;justify-content:center;gap:28px;margin:14px 0}
.vsbig>div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;flex:1;min-width:0}
.vsbig strong{font-family:"Saira Condensed";font-size:20px} .vsbig small{color:var(--muted)}
.vs{font-family:"Saira Condensed";font-weight:800;font-style:italic;font-size:34px;color:var(--red2)}
.oddbar{position:relative;height:24px;border-radius:6px;background:var(--panel3);overflow:hidden;margin:6px 0 10px}
.oddbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--red),var(--red2))}
.oddbar span{position:relative;display:block;text-align:center;line-height:24px;font-size:12.5px;font-weight:700}
.lineup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lu{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.lu:hover{border-color:var(--red)} .lu strong{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis} .lu b{font-family:"JetBrains Mono";font-size:16px}
.results{list-style:none;margin:0;padding:0}
.results li{display:grid;grid-template-columns:1fr auto auto auto auto auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.results .ev{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results b{font-family:"JetBrains Mono";color:var(--muted)} .results b.w{color:var(--ink)} .results i{color:var(--dim)}
.news{list-style:none;margin:0;padding:0} .news li{padding:7px 0 7px 10px;border-left:3px solid var(--line2);margin-bottom:6px;font-size:13.5px}
.news .n-bom{border-color:var(--win)} .news .n-ruim{border-color:var(--loss)} .news .n-titulo{border-color:var(--red)}

/* ---------- caixa ---------- */
.mail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:start}
.mlist{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:70vh;overflow-y:auto}
.mlist button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;border-left:3px solid transparent}
.mlist button.on{background:var(--panel2);border-left-color:var(--red)}
.mlist strong{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mlist span{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .mlist small{color:var(--dim);font-size:11.5px}
.mread p{font-size:16px}

/* ---------- elenco / perfil ---------- */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pcard.tit{border-color:rgba(229,22,43,.45)} .pcard.swap{outline:2px solid var(--warn)}
.pc-main{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 12px 10px;border:0;background:none;text-align:center;position:relative}
.pc-main:hover{background:rgba(255,255,255,.02)}
.pc-main strong{font-family:"Saira Condensed";font-size:20px;line-height:1}
.pc-main small{color:var(--muted);font-size:12px}
.pc-ovr{position:absolute;top:10px;right:12px;font-family:"JetBrains Mono";font-weight:700;font-size:20px;color:var(--warn)}
.pc-stars{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;margin-top:2px} .pc-stars em{font-size:10px;color:var(--muted);font-style:normal;text-transform:uppercase}
.pc-ag{font-size:11.5px;color:var(--muted)}
.bars{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;width:100%;margin-top:6px;align-items:center}
.bars label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:left}
.tog{border:0;border-top:1px solid var(--line);background:var(--panel3);padding:7px;font-weight:700;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tog.on{background:var(--red);color:#fff}
.tog.sm{border:1px solid var(--line2);border-radius:5px;padding:2px 8px}
.plink{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;text-align:left}
.plink strong{font-weight:700} .plink small{display:block;color:var(--muted);font-size:11.5px}
button.plink:hover strong{color:var(--red2)}
td.a5{color:#4ADE80;font-weight:700} td.a4{color:#A3E635} td.a3{color:var(--ink)} td.a2{color:#F5B942} td.a1{color:var(--loss)}
.phead{display:flex;gap:20px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden;background:linear-gradient(120deg,rgba(229,22,43,.16),var(--panel) 55%)}

.arow b.a2{background:rgba(245,185,66,.14);color:var(--warn)} .arow b.a1{background:rgba(248,113,113,.14);color:var(--loss)} .arow b.a0{color:var(--muted);font-size:12px}

/* ---------- staff / treino ---------- */

.agents{display:flex;flex-direction:column;gap:8px}

.ag span{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.comp-foot{display:flex;flex-direction:column;gap:8px;margin-top:12px}

.bc-alive{font-size:12px;color:var(--muted)} .bc-alive em{font-style:normal;font-weight:800;font-family:"JetBrains Mono"} #al-A{color:var(--ta)} #al-B{color:var(--tb)}
.dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin:8px 0 12px;min-height:12px}

.livegrid{display:grid;grid-template-columns:200px minmax(0,1fr) 200px;gap:12px;align-items:start;margin-bottom:12px}

.sidechip.atk{background:rgba(255,107,91,.18);color:var(--atk)} .sidechip.def{background:rgba(63,209,184,.18);color:var(--def)}

.lpn{flex:1;min-width:0} .lpn strong{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .lpn small{color:var(--muted);font-size:11.5px}
.lpk{font-family:"JetBrains Mono";font-size:12px;white-space:nowrap}
.lmap{position:relative;background:#0C0E14;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pdot circle{stroke:#0b0c10;stroke-width:3}

.rbanner{position:absolute;left:50%;top:14px;transform:translate(-50%,-12px);opacity:0;transition:.25s;background:rgba(10,11,15,.92);border:1px solid var(--line2);border-radius:10px;padding:8px 16px;text-align:center;pointer-events:none;max-width:90%}

/* ---------- responsivo ---------- */
@media (max-width:1100px){
  .livegrid{grid-template-columns:1fr 1fr}
  .lmap{grid-column:1 / -1;grid-row:1}
  .scards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .attrs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .game{display:block;height:auto}
  .side{flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .side .brand,.side .club,.sidefoot,.navsep{display:none}
  .navs{flex-direction:row;padding:6px}
  .navi{flex:none;padding:8px 10px} .navi span{display:none}
  .navi.on::before{left:8px;right:8px;top:auto;bottom:0;width:auto;height:3px}
  .mainc{height:auto}
  .stage{overflow:visible;padding:14px 16px 26px}
  .topbar{padding:10px 16px}
  .grid2,.grid2.wide,.grid3,.pickgrid,.tacgrid,.mail{grid-template-columns:minmax(0,1fr)}
  .tdetail{position:static}
  .lineup{grid-template-columns:repeat(3,minmax(0,1fr))}
  .scards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .attrs{grid-template-columns:minmax(0,1fr)}
  .bcast{grid-template-columns:1fr 1fr} .bc-c{grid-column:1 / -1;grid-row:1}
  .bc-t b{font-size:32px}
  .ag{grid-template-columns:auto 1fr} .ag select{grid-column:1 / -1}
  .hrow{grid-template-columns:auto 1fr 36px} .hrow .bar,.hrow .muted{display:none}
  .mhead{flex-wrap:wrap} .mt small{display:none}
}
@media (max-width:520px){
  .livegrid{grid-template-columns:minmax(0,1fr)}
  .pcards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vsbig{gap:10px} .topbar h1{font-size:22px} .pcard .st5 i{width:10px;height:10px}
}

/* ---------- entrada: menu ---------- */
.menu{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;background:#050608}

.wt{display:grid;place-items:center;border-radius:4px;box-shadow:inset 0 0 40px rgba(0,0,0,.45)}

.menushade{position:absolute;inset:0;background:radial-gradient(ellipse at 62% 50%,rgba(255,210,120,.10),transparent 45%),linear-gradient(90deg,rgba(5,6,8,.92) 0%,rgba(5,6,8,.55) 38%,rgba(5,6,8,.25) 70%,rgba(5,6,8,.7) 100%)}
.menuleft{position:relative;z-index:2;padding:16vh 0 0 6vw;max-width:520px}
.menulogo{display:inline-grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;margin-bottom:34px;font-family:"Saira Condensed",sans-serif;font-weight:800;line-height:.9;text-transform:uppercase}

.menunav{display:flex;flex-direction:column;gap:6px}

@keyframes float{50%{transform:translate(-30%,-51%)}}
.savecard{position:absolute;z-index:2;right:3vw;bottom:9vh;width:330px;background:rgba(14,16,22,.9);border:2px solid var(--red);border-radius:12px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.6)}

.savecard .btn{width:100%}
.menufoot{position:absolute;z-index:2;left:6vw;bottom:14px;color:rgba(255,255,255,.35);font-size:11.5px;margin:0}

.spgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
.splist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.spc{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.06);border-radius:6px;padding:10px}
.spc.on{border-color:rgba(74,222,128,.5)} .spc.off{opacity:.5}
.spi strong{display:block;font-size:13px;letter-spacing:.03em} .spi .meta{display:block;font-size:12px;color:var(--muted)} .spi small{display:block;font-size:11.5px;color:var(--muted)}
.cat{font-style:normal;background:#2E5AAC;color:#fff;border-radius:3px;padding:0 5px;font-size:11px;font-weight:700;margin-right:4px}
.tS{color:#F2C75C} .tA{color:#F5B942} .tB{color:#9FE8B8} .tC{color:#8BB8F0} .tD{color:#9AA3B5}
.spbtns{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap}
.spc .chip{grid-column:1 / -1;justify-self:start}
.spside{position:sticky;top:0}
.jersey{width:100%;max-width:360px;display:block;margin:0 auto;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6))}

/* finanças */
.fgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpis div{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.06);border-radius:6px;padding:10px;text-align:center}
.kpis small{display:block;color:var(--muted);font-size:11.5px} .kpis b{font-family:"JetBrains Mono";font-size:17px}
.finchart{width:100%;height:auto;display:block}
.finchart .gl{stroke:rgba(255,255,255,.07)} .finchart .ax{fill:var(--muted);font:11px Barlow,sans-serif}
.finchart .fb:hover rect[fill]{opacity:.85}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px} .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.frow{display:grid;grid-template-columns:190px 1fr auto;gap:10px;align-items:center;font-size:13px;margin-bottom:6px}
.frow i{display:block;height:8px;border-radius:4px} .frow b{font-family:"JetBrains Mono";font-size:12.5px}
.fdir{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;margin-top:16px;background:rgba(0,0,0,.22);border-radius:6px;padding:12px}
.fdir small{display:block;color:var(--muted);font-size:11px} .fdir p{grid-column:1 / -1;margin:6px 0 0;font-size:13px;color:#D5DAE3}
.ftx{max-height:70vh;overflow-y:auto}
.lb td,.lb th{padding:6px 8px;font-size:13px}
@media (max-width:1100px){.hgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .tcreator{grid-template-columns:minmax(0,1fr) 56px} .tcdet{grid-column:1 / -1} .qcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .side{background:rgba(8,10,14,.9)} .sidetop,.sidebottom .sidecash{display:none} .sidebottom{margin:0}
  .navi{padding:8px 10px} .navsep{display:none}
  .hstrip,.hgrid,.mailw,.qgrid,.qhero,.spgrid,.fgrid,.splist{grid-template-columns:minmax(0,1fr)}
  .tlw{overflow-x:auto} .bigev{border:0;padding:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .frow{grid-template-columns:120px 1fr auto}
  .topbar h1{font-size:20px}
}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
